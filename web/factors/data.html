        <script>
            // 處理圖片點擊事件
            function openImageInNewTab(src) {
                window.open(src, '_blank').focus();
            }
            
            function changeImages(type) {
            const basePath = `../assets/img/${type}/${type}`;

            document.getElementById("allImage").src = `${basePath}_all.png`;

            let year = 2018;
            for (let i = 1; i <= 5; i++) {
            document.getElementById(`image${i}`).src = `${basePath}_${year}.png`;
            year++;
            }

           // 根據選擇的類型來設定顯示文本
           let displayText = "";
           switch (type) {
         case 'vehicle':
            displayText = '從台灣2018~2022年來看，機車事故死亡人數皆為最高。小客車其次，不過在2021年，行人事故死亡率已經超過了小客車。因此可以更重視行人的安全。';
            break;
         case 'gender':
            displayText = '台灣男女駕駛交通工具比例以男性為大宗，尤其職業車輛，由圖可見因此男性的死亡人數五年來都比女性高。';
            break;
         case 'hitandrun':
            displayText = '從上圖可以看到，台北市為台灣首都，人口密度最高，因此肇逃率也最多，其次皆為六都，可得知人口越多及越發達地區，因為事故數越多，肇逃率也越多。';
            break;
         case 'age':
            displayText = '由上圖可得知，18~25歲的事故率最高，剛拿到駕照的年輕人以及大學生最容易發生交通事故，因此，交通部應擬更完善的安駕教育。';
            break;
         default:
            displayText = '請選擇一個選項。';
    }

    // 更新頁面上的文本元素
    document.getElementById("imageText").innerText = displayText;
}

        </script>
